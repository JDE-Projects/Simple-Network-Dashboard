[pytest]
# Browser-driven Playwright tests are excluded from the default run. They need a
# separately downloaded browser (`playwright install chromium`) and drive a real
# Chromium through Playwright's synchronous API, which holds an event loop open
# for the length of the run. Mixing that into the same process as the many tests
# that call asyncio.run() leaves a live loop behind and breaks them, so the two
# suites run as separate invocations:
#   pytest                     -> everything except the browser tests
#   pytest tests/browser -m browser  -> the browser tests only
markers =
    browser: browser-driven Playwright test (see tests/browser/README.md)
addopts = -m "not browser"
