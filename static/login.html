<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in | Simple Network Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1" />
<script>try { if (localStorage.getItem('snd-theme') === 'light') document.documentElement.classList.add('light'); } catch(e) {}</script>
<style>
@font-face { font-family:Sora; src:url('/static/fonts/Sora-Regular.ttf') format('truetype'); font-weight:400; }
@font-face { font-family:Sora; src:url('/static/fonts/Sora-SemiBold.ttf') format('truetype'); font-weight:600; }
@font-face { font-family:Sora; src:url('/static/fonts/Sora-Bold.ttf') format('truetype'); font-weight:700; }
@font-face { font-family:'JetBrains Mono'; src:url('/static/fonts/JetBrainsMono-Regular.ttf') format('truetype'); }
:root { --bg:#0a0e14; --bg-2:#0e131c; --panel:#121823; --panel-2:#161d2a; --border:#20293a; --border-2:#2b3650; --text:#dfe7f2; --text-dim:#8a98b0; --accent:#4dd6c1; --accent-2:#2bb6a3; --glow:rgba(77,214,193,.35); --red:#ff6b7a; --radius:14px; --radius-sm:9px; --btn-text:#042b27; }
html.light { --bg:#eef3f4; --bg-2:#e4ebed; --panel:#fff; --panel-2:#f5f9fa; --border:#d3dee1; --border-2:#bcccd0; --text:#16212c; --text-dim:#4f606d; --accent:#178577; --accent-2:#0f6b5f; --glow:rgba(23,133,119,.2); --red:#cf3b50; --btn-text:#fff; }
* { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--text); font-family:Sora,system-ui,sans-serif; background:radial-gradient(900px 500px at 12% -10%,rgba(77,214,193,.09),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(109,179,255,.06),transparent 55%),var(--bg); }
html.light body { background:radial-gradient(900px 500px at 12% -10%,rgba(23,133,119,.08),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(43,111,208,.06),transparent 55%),var(--bg); }
.card { width:min(100%,430px); padding:30px; background:linear-gradient(180deg,var(--panel),var(--bg-2)); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 18px 45px rgba(0,0,0,.22); }
.brand { position:fixed; top:16px; left:16px; display:flex; align-items:center; gap:13px; }.glyph { width:40px; height:40px; border-radius:11px; box-shadow:0 0 24px var(--glow); }.title { font-size:18px; font-weight:700; line-height:1.25; }.byline { margin-top:3px; color:var(--text-dim); font:11px 'JetBrains Mono',monospace; }.byline a { color:var(--accent); text-decoration:none; }
h1 { margin:0 0 8px; font-size:22px; } p { color:var(--text-dim); font-size:13px; line-height:1.5; }.field { display:grid; gap:7px; margin:22px 0 14px; }.field label { font-size:13px; font-weight:600; }.field input { width:100%; padding:10px 11px; color:var(--text); background:var(--bg); border:1px solid var(--border-2); border-radius:var(--radius-sm); font:inherit; }.field input:focus { outline:2px solid var(--accent); outline-offset:1px; }.remember { display:flex; align-items:flex-start; gap:8px; color:var(--text-dim); font-size:13px; }.remember input { accent-color:var(--accent); margin-top:2px; }.btn { width:100%; margin-top:24px; padding:10px 13px; border:0; border-radius:var(--radius-sm); color:var(--btn-text); font:600 13px Sora,sans-serif; cursor:pointer; background:linear-gradient(145deg,var(--accent),var(--accent-2)); box-shadow:0 4px 16px var(--glow); }.btn:focus-visible { outline:2px solid var(--text); outline-offset:3px; }.btn:disabled { opacity:.5; cursor:not-allowed; }.error { min-height:20px; margin:14px 0 0; color:var(--red); font-size:13px; }
.theme-btn { position:fixed; top:18px; right:18px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; color:var(--text-dim); background:transparent; border:1px solid var(--border-2); border-radius:var(--radius-sm); cursor:pointer; transition:.15s; }
.theme-btn:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
.theme-btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.theme-btn svg { width:18px; height:18px; }
.icon-moon { display:none; }
html.light .icon-sun { display:none; }
html.light .icon-moon { display:block; }
</style>
</head>
<body>
<button class="theme-btn" id="theme" type="button" title="Toggle theme" aria-label="Toggle theme">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
</button>
<header class="brand"><img class="glyph" src="/static/favicon.svg?v=1" alt="" /><div><div class="title">Simple Network Dashboard</div><div class="byline">by <a href="https://jde-projects.com" target="_blank" rel="noopener">JDE-Projects</a></div></div></header>
<main class="card">
  <h1>Sign in</h1><p>Enter the dashboard password to continue.</p>
  <form id="loginForm">
    <div class="field"><label for="password">Dashboard password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus /></div>
    <label class="remember"><input id="remembered" type="checkbox" /> <span>Remember this browser for 30 days</span></label>
    <button class="btn" id="submit" type="submit">Sign in</button>
    <p class="error" id="error" role="alert" aria-live="polite"></p>
  </form>
</main>
<script>
const root = document.documentElement;
document.getElementById('theme').addEventListener('click', () => { const light = root.classList.toggle('light'); try { localStorage.setItem('snd-theme', light ? 'light' : 'dark'); } catch(e) {} });
document.getElementById('loginForm').addEventListener('submit', async event => {
  event.preventDefault(); const button = document.getElementById('submit'); const error = document.getElementById('error');
  button.disabled = true; error.textContent = '';
  try {
    const response = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:document.getElementById('password').value, remembered:document.getElementById('remembered').checked})});
    const data = await response.json();
    if (response.ok && data.ok) { location.assign('/'); return; }
    error.textContent = data.retry_after ? `${data.error} Try again in ${data.retry_after} seconds.` : (data.error || data.detail || 'Sign-in could not be completed.');
  } catch(e) { error.textContent = 'Sign-in could not be completed. Check your connection and try again.'; }
  button.disabled = false;
});
</script>
</body>
</html>
