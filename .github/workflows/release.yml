name: Release
run-name: Release ${{ github.ref_name }}   # else the run is titled by the tagged commit's message
on:
  push:
    tags: ['v*']
jobs:
  release:
    uses: JDE-Projects/Build-Tools/.github/workflows/release-tarball.yml@01090b68a33074fda7fcd97d088cb29aa9718f61 # Build-Tools main (CI checks + RC tags auto-marked prerelease)
    permissions:
      id-token: write
      attestations: write
      contents: write
    with:
      app_name: simple-network-dashboard
      entry_script: "main.py"