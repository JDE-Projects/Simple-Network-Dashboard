name: Release
run-name: Release ${{ github.ref_name }}   # else the run is titled by the tagged commit's message
on:
  push:
    tags: ['v*']
jobs:
  release:
    uses: JDE-Projects/Build-Tools/.github/workflows/release-tarball.yml@c6d32f95dc283db8a0d753f0e2e5b87f4565fc6c # Build-Tools (CI checks + dev-pins, runtime-lock, release-version, shellcheck; RC tags kept as draft prereleases)
    permissions:
      id-token: write
      attestations: write
      contents: write
    with:
      app_name: simple-network-dashboard
      entry_script: "simple_network_dashboard"
      verify_dev_pins: true
      verify_runtime_lock: true
      verify_release_version: true
      shellcheck: true
      shellcheck_paths: "install.sh uninstall.sh"