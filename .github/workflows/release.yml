name: Release
run-name: Release ${{ github.ref_name }}   # else the run is titled by the tagged commit's message
on:
  push:
    tags: ['v*']
jobs:
  release:
    uses: JDE-Projects/Build-Tools/.github/workflows/release-tarball.yml@3736646d6f665a2b8671e4cf8c5c2973a93c4d14 # Build-Tools main (CI checks + RC tags auto-marked prerelease)
    permissions:
      id-token: write
      attestations: write
      contents: write
    with:
      app_name: simple-network-dashboard
      entry_script: "main.py"