name: Release
run-name: Release ${{ github.ref_name }}   # else the run is titled by the tagged commit's message
on:
  push:
    tags: ['v*']
jobs:
  release:
    uses: JDE-Projects/Build-Tools/.github/workflows/release-tarball.yml@47f198e465cafc2abd29980c08108b133746640e # Build-Tools (CI checks + dev-pins, runtime-lock, release-version, shellcheck; RC tags auto-marked prerelease)
    permissions:
      id-token: write
      attestations: write
      contents: write
    with:
      app_name: simple-network-dashboard
      entry_script: "main.py"
      verify_dev_pins: true
      verify_runtime_lock: true
      verify_release_version: true
      shellcheck: true
      shellcheck_paths: "install.sh uninstall.sh"