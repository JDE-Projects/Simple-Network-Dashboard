name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: JDE-Projects/Build-Tools/.github/workflows/ci.yml@1d4a3410cface7851db0d1b8da35d0c71b22cd3d # Build-Tools (ruff, import check, pytest, dev-pins, runtime-lock, shellcheck)
    permissions:
      contents: read
    with:
      entry_script: "main.py"
      verify_dev_pins: true
      verify_runtime_lock: true
      shellcheck: true
      shellcheck_paths: "install.sh uninstall.sh"