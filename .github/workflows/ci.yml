name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: JDE-Projects/Build-Tools/.github/workflows/ci.yml@3ee4b44ac0b4dc36a32995b7e13d0de1fd4d7d2f # Build-Tools (ruff, import check, pytest, dev-pins, runtime-lock, shellcheck)
    permissions:
      contents: read
    with:
      entry_script: "main.py"
      verify_dev_pins: true
      verify_runtime_lock: true
      shellcheck: true
      shellcheck_paths: "install.sh uninstall.sh"