name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: JDE-Projects/Build-Tools/.github/workflows/ci.yml@8ec7a5b067de5f23e2d7c769815da69e53e4938d # Build-Tools (ruff, import check, pytest, dev-pins, runtime-lock, shellcheck)
    permissions:
      contents: read
    with:
      entry_script: "simple_network_dashboard"
      verify_dev_pins: true
      verify_runtime_lock: true
      shellcheck: true
      shellcheck_paths: "install.sh uninstall.sh"